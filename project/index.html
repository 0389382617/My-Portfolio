                    <div class="executive-summary">
                        <h3 style="color: var(--accent); margin-bottom: 1.5rem; font-size: 2.2rem; font-family: var(--font-display);"><i class="fas fa-file-invoice-dollar" style="margin-right: 1rem;"></i> Executive Summary</h3>
                        <p style="font-size: 1.6rem; line-height: 1.8; color: var(--muted); margin-bottom: 1.5rem;">This analytical report investigates the dynamics of retail gasoline prices in Vietnam (specifically RON 95-III) by analyzing historical PVOil price data alongside global macroeconomic indicators. By evaluating the impact of Global Oil Prices, Inflation (CPI), and Political Stability, this project develops predictive models including ARIMAX, SARIMAX, and XGBoost to forecast fuel costs, providing actionable insights for logistics planning and supply chain cost optimization.</p>

                analysisText: `<strong style="font-size: 2.2rem; color: var(--accent); display: inline-block; margin-bottom: 1.5rem;"><i class="fas fa-chart-pie" style="margin-right: 0.8rem;"></i>Market Analysis & Strategic Selection</strong><br>
A comprehensive market analysis forms the foundation of our forecasting strategy. By evaluating the interplay of global macroeconomic indicators, we strategically selected the most impactful drivers shaping domestic fuel prices. Initial correlation analysis revealed critical relationships between these exogenous variables and the local market.<br><br>
<strong style="font-size: 2.0rem; color: var(--accent); display: inline-block; margin-bottom: 1rem;"><i class="fas fa-crosshairs" style="margin-right: 0.8rem;"></i>Strategic Target Variable Selection: Why RON 95-III?</strong><br>
Heavy fuels (e.g., FO 3%S, FO 3.5%S) frequently suffer from zero values or missing data, while kerosene/diesel (KO/DO) exhibit extreme volatility due to data scarcity and State price regulation mechanisms.`,

                analysisText2: `Rather than dispersing resources on niche fuels with fragmented data, the predictive model was strategically optimized for <strong>RON 95-III gasoline</strong> based on three core rationales:
<ul style="margin-top: 0.5rem; margin-bottom: 0;">
    <li><strong>Time-Series Integrity:</strong> Consistent and continuous historical data suitable for training.</li>
    <li><strong>High Macroeconomic Sensitivity:</strong> As an unleaded 95-octane gasoline conforming to national standards (TCVN 8063:2023 & QCVN 06:2022/BKHCN), its pricing is highly responsive to global macro shifts (<a href="https://comeco.vn/product/xang-ron-95-iii/" target="_blank" style="color: var(--accent); text-decoration: underline;">Reference</a>).</li>
    <li><strong>Market Representation:</strong> It is the most popular and widely consumed fuel, serving as a better market benchmark than E-biofuels.</li>
</ul>
<strong style="font-size: 2.0rem; color: var(--accent); display: inline-block; margin-bottom: 1rem; margin-top: 1.5rem;"><i class="fas fa-virus" style="margin-right: 0.8rem;"></i>The COVID-19 Hypothesis: When Data Goes 'Silent'</strong><br>

<ul style="margin-top: 0.5rem; margin-bottom: 1.5rem;">
    <li><strong>Left Panel (2020):</strong> Highlights early disease control efforts, characterized by widespread testing in Hanoi and unified public health campaigns, resulting in a low infection baseline.</li>

To accurately forecast domestic gasoline prices, the model integrates critical external variables. <strong>Global crude oil prices</strong> serve as the primary benchmark, while domestic <strong>inflation (CPI)</strong> and geopolitical <strong>stability indices (WGI_SC)</strong> are incorporated to account for macroeconomic conditions and global supply chain risks. This multi-dimensional approach significantly enhances the model's robustness and forecasting accuracy against unpredictable market fluctuations.`,
                analysisImage5: `../project image 2/Screenshot 2026-05-12 150956.png`,
                analysisText7: `<em><strong>Data Transformation Note:</strong> Since the macroeconomic variables (CPI, WGI_SC) were originally recorded at an annual frequency, they were normalized and distributed into a daily scale. This crucial preprocessing step ensures structural alignment with the daily PV Oil RON 95-III price data for precise time-series modeling.</em>`,
                analysisText8: `<strong style="font-size: 2.0rem; color: var(--accent); display: inline-block; margin-bottom: 1rem; margin-top: 1.5rem;"><i class="fas fa-lightbulb" style="margin-right: 0.8rem;"></i>Smart Data Processing Strategy</strong><br>To enable the model to learn underlying patterns while ensuring realistic evaluation, a distinct data processing strategy was applied to the Train and Test sets. For the training set, <strong>linear interpolation</strong> was utilized. Time-series data requires continuity; interpolation allows the model to learn and estimate parameters smoothly, avoiding sudden disruptions that could skew trend recognition.<br><br>However, for the testing set, the actual observed data was strictly maintained by dropping NaN values. During forecasting, the model relies on actual exogenous variables combined with real historical values. Consequently, the evaluation error (RMSE/MSE) on the Test set reflects the true real-world forecasting capability with 100% fidelity, rather than comparing against artificially interpolated figures.

<p style="margin-top: 1.5rem; margin-bottom: 1rem;">To enhance data 'smoothness', the team utilized the <strong>linear interpolation</strong> method.</p>
<img src="../project image 2/Screenshot 2026-05-12 170641.png" alt="Data Smoothness Image" style="width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 1.5rem;">
<strong style="font-size: 1.8rem; color: var(--text);">Why Linear Interpolation?</strong>
<ul style="margin-top: 0.5rem; margin-bottom: 1.5rem;">
    <li><strong>Maintaining Data Continuity:</strong> It creates a smooth value trajectory between two known points, preventing empty gaps or sudden abrupt jumps.</li>
    <li><strong>Preventing Major Distortions:</strong> Relying solely on Forward Fill (ffill) would replace missing values with the last known observation, creating artificial "flat" segments that fail to reflect actual market trends. Linear interpolation logically assumes a steady, proportional change.</li>
    <li><strong>Calculation Mechanism:</strong> It computes the price delta between two timestamps, divides it by the number of gap days, and cumulatively applies the increment.</li>
</ul>
<img src="../project image 2/Screenshot 2026-05-12 170545.png" alt="Smoothed Data Trajectory" style="width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 0.8rem;">
<p style="margin-top: 0; font-size: 1.4rem; color: var(--muted); font-style: italic; text-align: center;">The image demonstrates how linear interpolation results in a smoother data trajectory.</p>`,

After evaluating the ARIMA model, a critical limitation became apparent: it fails to account for exogenous variables, whereas domestic gasoline prices are heavily driven by global market fluctuations.<br><br>
<strong style="font-size: 2.0rem; color: var(--accent); display: inline-block; margin-bottom: 1rem;"><i class="fas fa-chart-line" style="margin-right: 0.8rem;"></i>ARIMAX</strong><br>
Recognizing this limitation, the architecture was upgraded from ARIMA to <strong>ARIMAX</strong>. This involved synchronizing and merging the dataset to incorporate key exogenous variables: Global Oil Price, Inflation (CPI), and Political Stability (WGI_SC). By doing so, the model can now capture the macroeconomic shocks driving domestic fuel prices.<br><br>The <code>auto_arima</code> function was utilized again to determine the optimal (p, d, q) parameters. Subsequently, the model was trained on the interpolated dataset and evaluated against the actual, un-interpolated test data.<br><br>

<ul style="margin-top: 0.5rem; margin-bottom: 1rem;">

<img src="../project image 2/Screenshot 2026-05-12 214526.png" alt="ARIMAX Further Analysis" style="width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 1rem;">
<ul style="margin-top: 0.5rem; margin-bottom: 1.5rem;">
    <li><strong>Inflation_CPI itpl_ln (0.476):</strong> Shows a moderate positive correlation. This indicates that as inflation rises, gasoline prices tend to increase accordingly. This aligns with economic rationale, as inflation reflects overall economic costs, inherently affecting fuel prices.</li>
    <li><strong>WGI_SC itpl_ln (-0.198):</strong> Demonstrates a weak negative correlation. Higher political stability correlates with less price volatility, suggesting effective government regulatory mechanisms that prevent speculative hoarding.</li>

<strong style="font-size: 2.0rem; color: var(--accent); display: inline-block; margin-bottom: 1rem;"><i class="fas fa-chart-area" style="margin-right: 0.8rem;"></i>SARIMAX (Seasonal ARIMAX)</strong><br>
Although the ARIMAX results showed improvement, the team wanted to investigate whether the gasoline price time-series exhibited seasonal characteristics. Building upon the ARIMAX architecture, the final phase involved upgrading to a <strong>SARIMAX</strong> model to capture these underlying seasonal patterns. By accounting for cyclical fluctuations alongside exogenous macroeconomic shocks, the model aims to further minimize forecasting errors and enhance the robustness of the predictions.<br><br>Similar to the previous phases, the (p, d, q) parameters for this SARIMAX iteration were determined using <code>auto_arima</code>, followed by training on the interpolated dataset and evaluating against the actual test data.<br><br>

The final results indicate that gasoline prices do not exhibit distinct seasonal cyclicality. Consequently, the SARIMAX model did not yield significantly superior performance compared to the ARIMAX model.`,

<ul style="margin-top: 1rem; margin-bottom: 1.5rem;">

The International team's raw activity — shipment jobs, revenue, container/TEU volume, saleman, branch, and trade route — is exported weekly from the operating system into a shared <strong>Google Sheet</strong>. That sheet is organized into three logical extracts that the dashboard reconciles against each other:

<strong style="font-size: 2.0rem; color: var(--accent); display: inline-block; margin-bottom: 1rem; margin-top: 2rem;"><i class="fas fa-bug" style="margin-right: 0.8rem;"></i>Bugs I Caught & Fixed</strong><br>
A few data-integrity issues surfaced during development that would have silently produced wrong numbers if left unchecked:
<ul>
    <li><strong>Silent number-parsing bug:</strong> the Google Sheets API returns large numbers as formatted strings (e.g. with thousand-separator commas). JavaScript's number parser only reads up to the first comma, so a value could get truncated to a fraction of itself without throwing any error. Fixed by requesting unformatted numeric values directly from the API instead of parsing display strings.</li>
    <li><strong>Container-volume double-counting:</strong> a container-size sub-column occasionally came through blank instead of zero, and an early version of the TEU formula treated blank as "add nothing extra" rather than excluding it correctly — inflating total TEU. Caught by cross-checking a recalculated total against a previously verified snapshot and tracing the gap back to that column.</li>
    <li><strong>Mismatched category label:</strong> the import/export split relied on a field expected to contain the word "Import," but the source system actually labels those rows "Inbound." The filter was silently returning zero for that entire segment until traced and corrected.</li>
    <li><strong>Time-bounded targets:</strong> a saleman whose plan only applies for part of the year needed to automatically disappear from target-tracking tables once their plan period ends, rather than showing a stale, no-longer-relevant target indefinitely.</li>
</ul>
<strong style="font-size: 2.0rem; color: var(--accent); display: inline-block; margin-bottom: 1rem; margin-top: 2rem;"><i class="fas fa-vial" style="margin-right: 0.8rem;"></i>QA & Validation Process</strong><br>

    <li>Row counts for every data extract are logged and displayed in the dashboard header itself, so a partial or failed data pull is visible immediately rather than discovered days later.</li>

        // Old inline-styled sub-headings become real headings; "==> Insight" becomes a callout label.
        function tidy(h) {
            if (!h) return h;
            return h
                .replace(/<h3 style="color: var\(--accent\)[^>]*>[\s\S]*?Executive Summary<\/h3>/g, '')
                .replace(/<strong style="font-size: 2\.\d?rem;[^"]*color: var\(--accent\)[^"]*">([\s\S]*?)<\/strong>(?:\s*<br>)?/g, '<h3 class="sub">$1</h3>')
                .replace(/<strong style="font-size: 1\.8rem; color: var\(--text\)[^"]*">([\s\S]*?)<\/strong>(?:\s*<br>)?/g, '<h4 class="sub">$1</h4>')
                .replace(/<strong style="font-size: 2\.0rem;">==> Insight:<\/strong>(?:\s*<br>)?/g, '<div class="insight-label">Insight</div>')
                .replace(/<strong>==><\/strong>/g, '<strong>→</strong>')
                .replace(/==>/g, '→');
        }

        // An <img>, wrapped in a figure with an optional caption and the "Confidential" badge when needed
        function imgTag(src, alt, cssClass, confidential, caption) {
            if (!src) return '';
            const img = `<img src="${src}" alt="${alt}"${cssClass ? ` class="${cssClass}"` : ''}>`;
            const frame = confidential
                ? `<div class="confidential-frame">${img}<div class="confidential-badge"><i class="fas fa-lock" aria-hidden="true"></i><span>Confidential</span><small>Figures hidden for privacy</small></div></div>`
                : img;
            return `<figure class="shot">${frame}${caption ? `<figcaption>${caption}</figcaption>` : ''}</figure>`;
        }
        const txt = (h, extra) => h ? `<div class="project-text"${extra || ''}>${tidy(h)}</div>` : '';

        if (projectId && projectData[projectId]) {
            const project = projectData[projectId];
            const conf = project.confidentialImages;
            document.title = project.title + ' | Luong Phat';

            if (metaDesc && project.subtitle) metaDesc.setAttribute('content', project.subtitle);

            heroEl.className = 'case-hero';
            heroEl.innerHTML = `

                project.improvementTitle ? section(project.improvementTitle, txt(project.improvementText)) : '',
                project.conclusion ? section(project.conclusionTitle || 'Conclusion', txt(project.conclusion)) : ''
            ].join('');

            // Wrap each "Insight" label and what follows it (until the next heading or figure) in a callout
            contentContainer.querySelectorAll('.insight-label').forEach(label => {
                const box = document.createElement('div');
                box.className = 'insight';
                label.parentNode.insertBefore(box, label);
                box.appendChild(label);
                let n = box.nextSibling;
                while (n && !(n.nodeType === 1 && (/^H[1-6]$/.test(n.tagName) || n.tagName === 'FIGURE' || n.classList.contains('insight-label')))) {
                    const next = n.nextSibling;
                    box.appendChild(n);
                    n = next;
                }
                while (box.lastChild && ((box.lastChild.nodeType === 1 && box.lastChild.tagName === 'BR') || (box.lastChild.nodeType === 3 && !box.lastChild.textContent.trim()))) box.removeChild(box.lastChild);
            });

            // Table of contents from the section headings, with scroll-spy
            const sections = [...contentContainer.querySelectorAll('.project-section')];
            sections.forEach((sec, i) => { sec.id = 'sec-' + (i + 1); });
            tocEl.innerHTML = `<p class="toc-title">On this page</p><ol>${sections.map(sec =>
                `<li><a href="#${sec.id}">${sec.querySelector('h2').textContent}</a></li>`).join('')}</ol>`;
            const tocLinks = [...tocEl.querySelectorAll('a')];
            if ('IntersectionObserver' in window) {
                const spy = new IntersectionObserver(entries => entries.forEach(en => {
                    if (!en.isIntersecting) return;
                    tocLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id));
                }), { rootMargin: '-20% 0px -70% 0px' });
                sections.forEach(sec => spy.observe(sec));
            }

            // Click an image to enlarge it
            const box = document.createElement('div');
            box.className = 'lightbox';
            box.setAttribute('role', 'dialog');
            box.setAttribute('aria-label', 'Image preview');
            box.innerHTML = '<button type="button" aria-label="Close preview"><i class="fas fa-xmark" aria-hidden="true"></i></button><img alt="">';
            document.body.appendChild(box);
            const close = () => box.classList.remove('open');
            contentContainer.querySelectorAll('figure.shot img').forEach(img => {
                img.tabIndex = 0;
                img.setAttribute('role', 'button');
                const open = () => { box.querySelector('img').src = img.src; box.querySelector('img').alt = img.alt; box.classList.add('open'); box.querySelector('button').focus(); };
                img.addEventListener('click', open);
                img.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
            });
            box.addEventListener('click', e => { if (e.target !== box.querySelector('img')) close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

            if (projectId === 'gls-dashboard') {
                initGlsDemo();
            }

            const others = Object.keys(projectData).filter(k => k !== projectId);
            document.getElementById('next-cases').innerHTML = `<div class="next-cases"><h2>More case studies</h2><div class="next-grid">${others.map(k =>

        } else {

            tocEl.remove();
            contentContainer.innerHTML = `<h1>Case study not found</h1><p class="description">Pick one from the <a href="../index.html#work">work section</a>.</p>`;
