                databaseText: `The dataset used in this project was sourced from the World Bank Data360 platform, focusing on Vietnam’s digital development and economic prosperity indicators.

                analysisText8: `The <strong>Employment to population ratio</strong> shows:<ul style="margin-bottom: 0;"><li>Cambodia: <strong>80%</strong></li><li>Vietnam: <strong>74%</strong></li><li>Thailand: <strong>71%</strong></li><li>Singapore: <strong>64%</strong></li><li>Malaysia: <strong>63%</strong></li></ul>

Vietnam is not just an alternative destination, but is gradually establishing its role as a <strong>new technology hub in Southeast Asia</strong>, with the capacity to scale and compete on the global investment map.`
